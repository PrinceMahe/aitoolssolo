baseURL = "https://www.aitoolssolo.com/"
languageCode = "en-us"
title = "AI Tools Solo — Smart AI Tools for Solopreneurs"
theme = "PaperMod"
paginate = 10
# Force a single canonical host (www) so link equity isn't split between
# aitoolssolo.com and www.aitoolssolo.com. Pair with the 301 in static/_redirects.
linkCanonical = true

[params]
  env = "production"
  description = "Discover the best AI tools, automation workflows, and SaaS comparisons built for solopreneurs. Real reviews, no fluff."
  author = "AI Tools Solo"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  comments = false
  # Surface 3 related posts at the bottom of every article -> more internal
  # links, longer sessions, and faster discovery/indexing of deep pages.
  related = true

  [params.homeInfoParams]
    Title = "🚀 There's an AI for that — for Solopreneurs"
    Content = "A directory of the best AI tools, organized by what you actually want to do. Search a task, find the tool, compare the options. No fluff."

  [[params.socialIcons]]
    name = "twitter"
    url = "https://twitter.com/alooftruck"

  label = "AI Tools Solo"

  [params.assets]
    favicon = "/favicon.ico"
    favicon16x16 = "/favicon-16x16.png"
    favicon32x32 = "/favicon-32x32.png"
    apple_touch_icon = "/apple-touch-icon.png"
    safari_pinned_tab = "/favicon.svg"

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.highlight]
    noClasses = false

[menu]
  [[menu.main]]
    identifier = "blog"
    name = "Blog"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "tools"
    name = "Tools"
    url = "/tools/"
    weight = 20
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 30
  [[menu.main]]
    identifier = "search"
    name = "Search"
    url = "/search/"
    weight = 40
  [[menu.main]]
    identifier = "usecases"
    name = "Use Cases"
    url = "/use-cases/"
    weight = 50

# Related-content matching so .Site.RegularPages.Related returns real suggestions.
[related]
  includeNewer = false
  threshold = 60
  toLower = false
  [[related.indices]]
    name = "tags"
    weight = 80
  [[related.indices]]
    name = "keywords"
    weight = 30
  [[related.indices]]
    name = "date"
    weight = 10
