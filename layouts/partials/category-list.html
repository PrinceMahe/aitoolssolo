{{/* List all tools in the current category */}}
{{- $slug := .Params.slug -}}
<div class="category-tools">
  <ul>
  {{- range $k, $t := .Site.Data.tools }}
    {{- if eq $t.category $slug }}
    <li class="tool-card">
      <a href="/tools/{{ $t.slug }}/"><strong>{{ $t.name }}</strong></a>
      <span class="tool-cat-summary">— {{ $t.summary }}</span>
      <div class="tool-pricing-mini">Pricing: {{ $t.pricing }}</div>
    </li>
    {{- end }}
  {{- end }}
  </ul>
</div>
