features:
  - Free double-entry accounting with income/expense tracking and bank reconciliation
  - Branded recurring invoices with sent/viewed/paid tracking and auto-charge
  - Receipt scanning and expense categorisation via the mobile app
  - Wave Payments for card and bank (ACH) invoice collection
