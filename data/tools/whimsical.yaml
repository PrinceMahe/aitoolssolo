features:
  - Fast flowcharting with snapping connectors and clean default styling
  - Simple wireframe surface for quick UI and screen thinking
  - Structured mind maps and flexible boards for planning
  - AI-assisted docs and diagram generation from ideas or briefs
  - Real-time collaboration with live edits and comments
best_for:
